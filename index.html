<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MovieWatchlist</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="container">
    <section id="auth-section" class="card">
      <h1>MovieWatchlist</h1>
      <p class="subtitle">Keep track of movies you want to watch.</p>

      <div class="tabs">
        <button id="show-login" class="tab active">Log In</button>
        <button id="show-register" class="tab">Register</button>
      </div>

      <form id="auth-form">
        <input id="username" type="text" placeholder="Username" required />
        <input id="password" type="password" placeholder="Password" required />
        <button type="submit" id="auth-submit">Log In</button>
      </form>
      <p id="auth-message" class="message"></p>
    </section>

    <section id="app-section" class="hidden">
      <header class="app-header">
        <div>
          <h1>MovieWatchlist</h1>
          <p id="welcome"></p>
        </div>
        <button id="logout-btn" class="secondary">Log Out</button>
      </header>

      <section class="card">
        <h2>Add a Movie</h2>
        <form id="movie-form">
          <input id="movie-title" type="text" placeholder="Movie title" required />
          <input id="movie-year" type="number" min="1888" max="2100" placeholder="Release year" />
          <select id="movie-status">
            <option value="Want to Watch">Want to Watch</option>
            <option value="Watching">Watching</option>
            <option value="Watched">Watched</option>
          </select>
          <input id="movie-rating" type="number" min="0" max="10" step="0.5" placeholder="Your rating (0-10, optional)" />
          <textarea id="movie-notes" placeholder="Notes (optional)"></textarea>
          <button type="submit">Add Movie</button>
        </form>
        <p id="movie-message" class="message"></p>
      </section>

      <section class="card">
        <div class="section-heading">
          <h2>My Movies</h2>
          <button id="refresh-btn" class="secondary">Refresh</button>
        </div>
        <div id="movie-list"></div>
      </section>
    </section>
  </main>

  <script src="https://unpkg.com/parse/dist/parse.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
